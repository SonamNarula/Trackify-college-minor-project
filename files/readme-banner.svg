<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Trackify: student productivity and placement tracker" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1a"/><stop offset="0.5" stop-color="#0a1b30"/><stop offset="1" stop-color="#0d2a40"/>
    </linearGradient>
    <radialGradient id="gA" cx="0.1" cy="0.15" r="0.5"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx="0.95" cy="0.95" r="0.5"><stop offset="0" stop-color="#6aa7ab" stop-opacity="0.35"/><stop offset="1" stop-color="#6aa7ab" stop-opacity="0"/></radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#6aa7ab"/></linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity="0.06"/></pattern>
  </defs>
  <rect width="1280" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="22" fill="url(#dots)"/>
  <rect width="1280" height="360" rx="22" fill="url(#gA)"/>
  <rect width="1280" height="360" rx="22" fill="url(#gB)"/>
  <rect x="1" y="1" width="1278" height="358" rx="21" fill="none" stroke="#38bdf8" stroke-opacity="0.2"/>

  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" fill="#38bdf8" fill-opacity="0.1">
    <text x="84" y="338">streak = lastStudy === yesterday ? streak + 1 : 1;</text>
    <text x="600" y="338">completion = done / total;</text>
    <text x="900" y="338">status: applied → interview → selected</text>
  </g>

  <!-- app icon -->
  <rect x="84" y="62" width="46" height="46" rx="12" fill="#38bdf8"/>
  <text x="107" y="95" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="800" fill="#06101d">T</text>
  <text x="146" y="92" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" letter-spacing="3" fill="#6aa7ab">STUDENT PRODUCTIVITY &amp; PLACEMENT TRACKER</text>

  <text x="80" y="196" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="800" fill="#FFFFFF" textLength="400" lengthAdjust="spacingAndGlyphs">Trackify</text>
  <rect x="84" y="214" width="130" height="4" rx="2" fill="url(#bar)">
    <animate attributeName="width" values="90;250;90" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="84" y="254" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#CBD5E1">Tasks, study hours and placement offers, in one honest dashboard.</text>

  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700">
    <rect x="84" y="280" width="250" height="34" rx="17" fill="#38bdf8"/>
    <text x="209" y="302" text-anchor="middle" fill="#06101d" letter-spacing="1">REACT 18 · TYPESCRIPT</text>
    <rect x="348" y="280" width="270" height="34" rx="17" fill="#0a1b30" stroke="#6aa7ab" stroke-opacity="0.8"/>
    <text x="483" y="302" text-anchor="middle" fill="#6aa7ab" letter-spacing="1">RULE-BASED AI COACH</text>
    <rect x="632" y="280" width="190" height="34" rx="17" fill="#0a1b30" stroke="#6aa7ab" stroke-opacity="0.8"/>
    <text x="727" y="302" text-anchor="middle" fill="#6aa7ab" letter-spacing="1">LIGHT + DARK</text>
  </g>

  <!-- mini dashboard card -->
  <g transform="translate(944 62)">
    <rect width="296" height="236" rx="16" fill="#070d1a" fill-opacity="0.9" stroke="#38bdf8" stroke-opacity="0.35"/>
    <text x="24" y="38" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.5" fill="#6aa7ab">DAILY STUDY GOAL</text>
    <circle cx="148" cy="112" r="50" fill="none" stroke="#12304a" stroke-width="10"/>
    <circle cx="148" cy="112" r="50" fill="none" stroke="#6aa7ab" stroke-width="10" stroke-linecap="round" stroke-dasharray="314" stroke-dashoffset="314" transform="rotate(-90 148 112)">
      <animate attributeName="stroke-dashoffset" values="314;0;0;314" keyTimes="0;0.4;0.9;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="148" y="119" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="800" fill="#fff">100%</text>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">
      <rect x="24" y="186" width="118" height="30" rx="8" fill="#0d2a40"/>
      <text x="36" y="206" fill="#fb923c">&#9650; 1 day streak</text>
      <rect x="154" y="186" width="118" height="30" rx="8" fill="#0d2a40"/>
      <text x="166" y="206" fill="#38bdf8">4 DSA solved</text>
    </g>
  </g>
</svg>
